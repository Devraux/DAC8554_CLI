
name: Build and publish Raspberry Pi Pico UF2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            build-essential

      - name: Download Raspberry Pi Pico SDK
        run: |
          git clone --depth 1 --branch 2.2.0 --recurse-submodules \
            https://github.com/raspberrypi/pico-sdk.git pico-sdk

      - name: Build UF2
        run: |
          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"

          cmake -S . -B build -G Ninja \
            -DPICO_BOARD=pico \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build

          test -f build/main.uf2

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          tags=$(git tag --list "v1.*" | grep -E '^v1\.[0-9]+$' || true)

          if [ -z "$tags" ]; then
            next=4
          else
            max=$(echo "$tags" | sed 's/^v1\.//' | sort -n | tail -1)
            next=$((max + 1))
          fi

          version="v1.$next"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CFD DAC8554 Controller ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/main.uf2
